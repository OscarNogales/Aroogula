[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -vv
    -ra
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
markers =
    unit: fast isolated unit tests that use fakes, monkeypatching, tmp_path, or in-memory data.
    integration: tests that exercise multiple real components together.
    external: tests that require network, Alpaca, Ollama, yfinance, or other external services.
    slow: tests that are intentionally slower than normal unit tests.
filterwarnings =
    ignore::FutureWarning
